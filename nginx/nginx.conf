worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                           'rt=$request_time upstream=$upstream_addr '
                           'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstreamlog buffer=256k flush=2s;

    keepalive_requests 1000000;
    keepalive_timeout 75s;

    upstream web_backend {
        server web:8000 max_fails=1 fail_timeout=5s;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        location = /noop {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 3s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
